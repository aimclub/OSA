[project]
name = "osa_tool"
version = "0.3.0"
description = "Tool that just makes your open source project better!"
requires-python = ">=3.11,<4.0"
authors = [
    { name = "ITMO-NSS-team", email = "itmo.nss.team@gmail.com" }
]
readme = "README.md"
license = "BSD-3-Clause"
packages = [{ include = "osa_tool" }]
dynamic = ["dependencies"]

[project.urls]
Homepage = "https://github.com/aimclub/OSA"
Documentation = "https://itmo-nss-team.github.io/Open-Source-Advisor/"
Issues = "https://github.com/aimclub/OSA/issues"

[project.optional-dependencies]
paper-claims = [
    # Marker 1.x's transitive dependency stack has no compatible Python 3.15 distribution yet.
    "marker-pdf>=1.10.2,<2.0.0; python_version < '3.15'",
    "markdown-it-py>=3.0.0",
    "numpy>=1.26.0,<3.0.0",
    "pypdf>=5.0.0",
    "rapidfuzz>=3.14.0",
    "scipy>=1.13.0,<2.0.0",
    "sentence-transformers>=3.0.0,<6.0.0",
]
repository-validation = [
    "matplotlib>=3.10.9",
    "networkx>=3.6.1; python_full_version != '3.14.1'",
    "networkx>=3.6,<3.6.1; python_full_version == '3.14.1'",
    "torch>=2.11.0; python_version < '3.15'",
    "torch-geometric>=2.7.0",
    "transformers>=4.45.2,<5.0.0",
]

[tool.poetry.dependencies]
aiofiles = ">=24.1.0"
black = ">=25.0.0"
colorama = ">=0.4.6"
docx2txt = ">=0.9"
GitPython = ">=3.1.40"
json-repair = { extras = ["schema"], version = "~=0.60.0" }
libcst = ">=1.8.6"
mkdocs = ">=1.6.0"
mkdocs-material = ">=9.6.0"
mkdocstrings = { extras = ["python"], version = ">=0.29.0" }
mkdocstrings-python = ">=1.16.0"
nbconvert = ">=6.0"
nbformat = ">=5.0"
packaging = ">=25.0"
pandas = ">=2.2.0,<3.0.0"
pdfplumber = ">=0.11.0"
protollm = ">=0.1.8"
prompt_toolkit = ">=3.0.50"
Pygments = ">=2.18.0"
pydantic = ">=2.9.0,<3.0.0"
qrcode = ">=7.4.0"
reportlab = ">=4.2.0,<5.0.0"
structlog = ">=24.4.0"
tiktoken = ">=0.8.0"
tomli = ">=2.0.0"
tree-sitter = ">=0.23.0"
tree-sitter-javascript = ">=0.25.0"
tree-sitter-python = ">=0.23.0"
tree-sitter-typescript = ">=0.23.2"
pipreqs = { version = ">=0.5.0", python = "<3.13" }

[tool.poetry.group.dev.dependencies]
pre-commit = ">=4.0.0"
pytest = ">=8.3.0"
pytest-asyncio = ">=1.0.0"
pytest-mock = ">=3.12.0"

[project.scripts]
osa-tool = "osa_tool.run:main"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
target-version = ["py312"]
