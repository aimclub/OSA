name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Installing Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installing dependencies
        run: |
          pip install -r requirements.txt
          pip install ".[paper-claims,repository-validation]"
          pip install pytest

      - name: Run tests
        run: PYTHONPATH=$PWD pytest tests/

  test_mcp:
    name: Test MCP extra
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install MCP and test dependencies
        run: |
          uv venv --python 3.11
          uv pip install ".[mcp]" "pytest>=8.3" "pytest-asyncio>=1.0"

      - name: Run local transport and assessment tests
        run: |
          uv run --no-project python -c "import mcp, pytest_asyncio"
          uv run --no-project pytest --noconftest \
            tests/integration/test_mcp_http.py \
            tests/unit/operations/analysis/repository_quality/test_assessment.py

  build_docs_pr:
    name: Build Docs (PR Check)
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Installing Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installing MkDocs dependencies
        run: |
          pip install mkdocs mkdocs-material mkdocstrings[python]

      - name: Check generated CLI reference
        run: python docs/generate_cli_reference.py --check

      - name: Build docs (verify only)
        run: mkdocs build --strict

  deploy_docs_main:
    name: Deploy Docs
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Installing Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installing MkDocs dependencies
        run: |
          pip install mkdocs mkdocs-material mkdocstrings[python]

      - name: Docs deploy
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/aimclub/OSA.git
          mkdocs gh-deploy --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
